<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Magic Deckbuilder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Magic Deckbuilder</h1>

<!-- Deck erstellen -->
<div class="deck-section">
  <h2>Neues Deck erstellen</h2>
  <input type="text" id="deck-name" placeholder="Deckname">
  <button id="create-deck-btn">Deck erstellen</button>
  <p id="deck-message"></p>
  <select id="deck-select"></select>
</div>

<hr>

<!-- Karten suchen -->
<div class="search-section">
  <h2>Karten suchen</h2>
  <input type="text" id="card-search" placeholder="Kartennamen">
  <div id="search-results"></div>
</div>

<script src="app.js"></script>
</body>
</html>
